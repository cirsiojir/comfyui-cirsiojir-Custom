name: Build and Push Docker Image
on:
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push CUDA 13.0
        run: |
          docker buildx bake cuda13 \
            --set "*.tags=ghcr.io/${{ github.repository_owner }}/comfyui-cirsiojir:cuda13.0" \
            --no-cache \
            --push
      - name: Build and Push CUDA 12.8
        run: |
          docker buildx bake regular \
            --set "*.tags=ghcr.io/${{ github.repository_owner }}/comfyui-cirsiojir:cuda12.8" \
            --no-cache \
            --push
